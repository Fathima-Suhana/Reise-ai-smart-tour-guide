        <select id="t0"></select>
        <label>Interests</label>
        <div class="chips" id="chips"></div>
      </div>
      <div class="card info" id="info"></div>
    </div>
    <div class="col">

        <h2>Interactive world map</h2>
        <div class="chips" style="margin-bottom:8px"><button class="chip on" id="tw">🌍 World</button><button class="chip" id="tc">📍 City route</button><button class="chip" id="tn">🧭 Navigate</button></div>
        <svg id="map" viewBox="0 0 200 100" role="img" aria-label="Map of attractions"></svg>
        <div id="navp" style="display:none">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label for="nf">From</label><select id="nf"></select></div><div><label for="nt">To</label><select id="nt"></select></div></div>
          <div class="chips" style="margin:10px 0"><button class="chip on" id="nm1">🚶 Walk</button><button class="chip" id="nm2">🚗 Drive</button><button class="btnp" id="ngo">▶ Start</button><button class="btn" id="nall">Demo my plan</button><button class="btn" id="ndemo">🎬 Demo</button></div>
          <div class="meta" id="ngm"></div>
          <div id="nsum" style="margin:6px 0"></div>
          <div class="nb"><div class="ic" id="nic">🧭</div><div><b id="ntx"></b><div class="meta" id="nsub"></div></div></div>
          <div id="nsteps"></div>
          <div class="meta" style="margin-top:6px">Start follows your real GPS position: the arrow moves only when you walk or drive. Demo plays a sped-up preview.</div>
        </div>
      </div>
      <div class="card">
        <h2>Dynamic itinerary</h2>
        <div class="sum" id="sum"></div>
        <div id="list"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>
</div>

France:["Take the lift or climb the stairs to the first and second floors for sweeping views over the Seine. The tower sparkles for five minutes at the top of every hour after dark. Book timed tickets ahead to skip long queues.","Head for the Mona Lisa, the Venus de Milo and the Winged Victory of Samothrace, then explore the Egyptian and Islamic art wings. The glass pyramid entrance was added in 1989. A weekday evening is usually the quietest time.","Look up at the twin towers, the rose windows and the gargoyles on the façade. The cathedral has reopened after the 2019 fire. The square outside is a good spot to take in the Seine’s islands.","Climb the stairs to the rooftop terrace for a view down the Champs-Élysées. The Tomb of the Unknown Soldier lies beneath the arch, with a flame rekindled every evening. Use the underground passage to reach it, not the roundabout.","Climb the steps or take the funicular, then enjoy views over the whole city from the front terrace. Inside, a golden mosaic fills the apse. The nearby streets of Montmartre are full of artists’ squares and cafés.","See Monet, Renoir, Degas, Van Gogh and Cézanne in the old station’s grand hall. The café behind the big clock has a lovely view. Thursday evenings are usually quieter.","Rent a chair by the central pond, watch the boules players and visit the orchard and the Medici Fountain. It is a calm break between museum visits.","Walk up the grand marble staircase and look up at the ceiling painted by Marc Chagall in the auditorium. The gilded foyer is just as lavish as the stage.","Pick up a map at the entrance to find the graves of Oscar Wilde, Jim Morrison and Édith Piaf. The shaded paths make for a long, peaceful stroll.","Stroll between fountains and statues from the Louvre toward the Place de la Concorde. In summer a small funfair and refreshment kiosks open here."],
India:["Enter through the Lahori Gate and walk the covered Chhatta Chowk bazaar. Inside, see the Diwan-i-Aam and the small museums. A light-and-sound show runs in the evening.","The lawns and the broad avenue nearby are popular for evening walks and ice cream. The memorial is lit up after dark. Arrive near sunset for the best light.","Look closely at the carved verses on the tower and walk around the ruined mosque and the famous Iron Pillar. Early mornings are cooler and calmer.","Wander the symmetrical Charbagh gardens and the tombs of the Mughal court inside. The red sandstone and white marble look best in late afternoon light.","Sit quietly in the central hall, where photography is not allowed. Walk the pools and gardens around the petals before you go in. The temple is closed on Mondays.","Follow the paths between the Bara Gumbad, the Shisha Gumbad and the tombs, and look for birds around the pond. It is a green escape from the city’s traffic."],
Italy:["Book a ticket that includes the arena floor and the underground chambers where gladiators and animals waited. Combined tickets also cover the Forum and Palatine Hill. Go at opening time to beat the heat and queues.","Walk the Via Sacra past the Arch of Titus, the Temple of Saturn and the Senate House. A good audio guide helps make sense of the ruins. Wear comfortable shoes for the uneven stones.","Stand beneath the oculus, the circular opening in the dome, and watch the beam of light move across the floor. The painter Raphael is buried here. Go early to avoid queues.","Toss a coin over your left shoulder with your right hand for a wish to return to Rome. Visit very early or late at night for space to enjoy the sculptures. Watch for pickpockets in the crowd.","Follow the route through the galleries to the Raphael Rooms and finish in the Sistine Chapel. Silence is requested in the chapel and photos are not allowed. Book timed tickets online.","Rent a bike or a rowboat on the little lake and see the Temple of Aesculapius. The Galleria Borghese inside needs a separate reservation."],
Japan:["Walk down the Nakamise shopping street from the Kaminarimon gate to the main hall. Waft incense smoke over yourself for good health and try the omikuji fortune slips. Go early for fewer crowds.","Pass beneath the huge torii gate and walk the gravel path through the forest. You may see a Shinto wedding procession on weekends. Write a wish on a wooden ema plaque.","Ride the lift to the Tembo Deck and, on a clear day, see as far as Mount Fuji. The Solamachi mall at its base has shops and an aquarium. Book tickets online for sunset.","Watch the crossing from a café window or the Shibuya Sky observation deck. Meet at the statue of the dog Hachiko outside the station. Evenings are the busiest and most colourful.","Visit the Tokyo National Museum, the zoo and Shinobazu Pond among the lotus and cherry trees. Spring weekends are packed with picnic parties under the blossoms.","Walk the stone walls and old guardhouses toward the foundations of the main keep. Entry is free but the gardens close on some days, so check the calendar. Seasonal flowers fill the grounds."],
UK:["See the Crown Jewels, the White Tower and the armour collection. Yeoman Warders, known as Beefeaters, lead entertaining tours. Arrive at opening to see the jewels before the queues build.","See the Rosetta Stone, the Parthenon sculptures and the Egyptian mummies. The Great Court’s glass roof is worth a look. Entry is free but busy, so pick a few galleries.","Watch the Changing of the Guard on scheduled days. In summer the State Rooms open to visitors. Stand early near the gates for a good view.","Walk the nave to Poets’ Corner and the Coronation Chair, and look up at the fan vaulting of the Lady Chapel. Photography is not allowed inside.","Hire a pedalo on the Serpentine, visit the Diana memorial fountain and walk on to Kensington Gardens. Sundays bring open-air speakers to Speakers’ Corner.","Cross the Millennium Bridge from St Paul’s and take the lift to the viewing level for city views. Check what is on in the Turbine Hall."]};

function plan(){

  while(true){
    var best=null,bv=0,bs=0,bt=0;
    P.forEach(function(p){
      if(used[p.id]||st.skip[p.id])return;
      if(!p.tags.some(function(g){return st.tags[g]})&&p.w<3)return;
      var tr=travel(cur,p),arr=now+tr,s0=Math.max(arr,p.o);
      if(s0-arr>60||s0+p.d>p.z||s0+p.d>end)return;
      var v=score(p)/(s0+p.d-now);if(v>bv){bv=v;best=p;bs=s0;bt=tr}
    });
    if(!best)break;
    out.push({p:best,tr:bt,at:bs,wait:bs-(now+bt)});now=bs+best.d;cur=best;used[best.id]=1;cost+=best.fee;
  }

}

    navPrep([{x:xy.x,y:xy.y,n:"Your location"},P[nav.t]]);nav.go=true;nav.live=true;nav.run=false;nav.h=navPos().hd;$("ngo").textContent="■ End";$("ngm").textContent="Live GPS is on. Walk or drive and the map follows you.";
  }
  nav.gps={x:xy.x,y:xy.y};
  var s=snap(xy.x,xy.y);
  if(s.e*MU()>150&&Date.now()-gps.rr>5000){gps.rr=Date.now();navPrep([{x:xy.x,y:xy.y,n:"Your location"},P[nav.t]]);$("ngm").textContent="Off route. Rerouting…";s={e:0,d:0}}
  nav.d=s.d;if(nav.tot-nav.d<30/MU())nav.d=nav.tot;
  if(st.view==="nav")navDraw();else navHud();
}
function gpsStart(){
  if(!navigator.geolocation){$("ngm").textContent="Location is not available in this browser.";return}
  navStop();gps.rr=0;$("ngm").textContent="Waiting for your location…";$("ngo").textContent="■ End";
  gps.id=navigator.geolocation.watchPosition(onFix,function(e){navStop();$("ngm").textContent=e.code===1?"Location access was blocked. Allow location for this page, or open the page in its own browser tab.":"Could not get your location. Try again outdoors."},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
function planOld(){
  var left=st.hrs*60,cur=P[st.start],out=[],used={},t=0;
  function score(p){var m=0;p.tags.forEach(function(g){if(st.tags[g])m++});return m*3+p.w}
  while(true){
    var best=null,bv=0;
    P.forEach(function(p){
      if(used[p.id]||st.skip[p.id]||p.id===st.start&&false)return;
      if(!p.tags.some(function(g){return st.tags[g]})&&p.w<3)return;
      var c=travel(cur,p)+p.d; if(c>left)return;
      var v=score(p)/c; if(v>bv){bv=v;best=p;best.c=c}
    });
    if(!best)break;
    var tr=travel(cur,best);out.push({p:best,tr:tr,at:t+tr});
    t+=tr+best.d;left-=tr+best.d;used[best.id]=1;cur=best;
  }
  st.plan=out;return {used:t,left:left};
}
function fmt(m){var h=Math.floor(m/60),r=m%60;return (h?h+"h ":"")+(r?r+"m":h?"":"0m")}
function render(){
  $("hv").textContent=st.hrs+" h";
  var r=plan(),ids={};st.plan.forEach(function(s,i){ids[s.p.id]=i+1});
  $("tw").className="chip"+(st.view==="world"?" on":"");$("tc").className="chip"+(st.view==="city"?" on":"");$("tn").className="chip"+(st.view==="nav"?" on":"");$("navp").style.display=st.view==="nav"?"block":"none";
  if(st.view==="world")worldMap();else if(st.view==="nav")navDraw();else{
  $("map").setAttribute("viewBox","0 0 100 80");
  var s=streetLayer();
  if(st.plan.length){var pts=[P[st.start]].concat(st.plan.map(function(x){return x.p}));
    s+='<polyline points="'+pts.map(function(p){return p.x+","+p.y}).join(" ")+'" fill="none" stroke="var(--ac)" stroke-width=".8" stroke-dasharray="1.6 1.2"/>';}
  s+='<circle cx="'+P[st.start].x+'" cy="'+P[st.start].y+'" r="3.6" fill="none" stroke="var(--warn)" stroke-width=".5"/>';
  P.forEach(function(p){
    var cls="pin"+(ids[p.id]?" stop":"")+(st.sel===p.id?" sel":"");
    s+='<g class="'+cls+'" data-id="'+p.id+'"><circle cx="'+p.x+'" cy="'+p.y+'" r="2.4"/>'+
      (ids[p.id]?'<text class="n" x="'+p.x+'" y="'+(p.y+1)+'">'+ids[p.id]+'</text>':'')+
      '<text x="'+(p.x+3.2)+'" y="'+(p.y+1)+'">'+p.n+'</text></g>';
  });
  $("map").innerHTML=s;
  document.querySelectorAll(".pin").forEach(function(g){g.onclick=function(){st.sel=+g.dataset.id;render()}});
  }
  // Itinerary list
  $("sum").innerHTML='<div><b>'+st.plan.length+'</b>stops</div><div><b>'+fmt(r.used)+'</b>planned</div><div><b>'+fmt(Math.max(r.left,0))+'</b>spare</div><div><b>'+CUR[st.country]+r.cost.toLocaleString()+'</b>entry fees</div><div><b>'+clk(r.fin)+'</b>finish</div>';
  var h='';st.plan.forEach(function(x,i){
    h+='<div class="stopitem"><div class="num">'+(i+1)+'</div><div class="t" data-id="'+x.p.id+'"><b>'+x.p.n+'</b><div class="meta">'+
    'Travel '+x.tr+' min · 🕒 '+clk(x.at)+'–'+clk(x.at+x.p.d)+' (closes '+clk(x.p.z)+') · '+CROWD[x.p.cr]+' · 🎟️ '+feeTxt(x.p)+(x.wait>0?' · waits '+x.wait+' min for opening':'')+'</div></div><button class="x" title="Skip this stop" aria-label="Skip '+x.p.n+'" data-skip="'+x.p.id+'">×</button></div>';});
  $("list").innerHTML=h||'<div class="meta">No attractions fit. Add time or pick more interests.</div>';
  document.querySelectorAll(".t").forEach(function(e){e.onclick=function(){st.sel=+e.dataset.id;render()}});
  document.querySelectorAll("[data-skip]").forEach(function(b){b.onclick=function(){st.skip[b.dataset.skip]=1;render()}});
  var sk=Object.keys(st.skip).length;
  $("note").innerHTML=sk?sk+' skipped · <button class="btn" id="rs">Restore all</button>':'';
  if(sk)$("rs").onclick=function(){st.skip={};render()};
  // Module 3: info panel
  var p=st.sel!==null?P[st.sel]:null;
  $("info").innerHTML='<h2>Tourist information</h2>'+(p?
    '<h3>'+p.n+'</h3><div class="meta">'+p.tags.join(" · ")+'</div><div class="facts"><div class="fb" style="background:var(--p1)">🕒 Hours<b>'+clk(p.o)+'–'+clk(p.z)+'</b></div><div class="fb" style="background:var(--p2)">👥 Crowd<b>'+CROWD[p.cr]+'</b></div><div class="fb" style="background:var(--p3)">🎟️ Entry fee<b>'+feeTxt(p)+'</b></div><div class="fb" style="background:var(--p4)">⏱️ Visit time<b>'+fmt(p.d)+'</b></div></div><h4 style="margin:10px 0 2px;font-size:13px;color:var(--mute)">History</h4><p style="margin:0">'+p.h+'</p><h4 style="margin:10px 0 2px;font-size:13px;color:var(--mute)">What to see and tips</h4><p style="margin:0">'+p.m+'</p><h4 style="margin:10px 0 2px;font-size:13px;color:var(--mute)">Plan your visit</h4><p style="margin:0">'+visitTip(p)+'</p><div class="fact"><b>🎉 Fun facts</b><br>• '+p.f+'<br>• '+p.f2+'</div><div class="meta" style="margin-top:8px">Typical hours and prices. Confirm before visiting.</div>'
    :'<div class="meta">Tap a place on the map or in your itinerary to see its history and a fun fact.</div>');
}
// Module 1 wiring
function fillStart(){fillNav();$("start").innerHTML="";P.forEach(function(p){var o=document.createElement("option");o.value=p.id;o.textContent=p.n;$("start").appendChild(o)});$("start").value=st.start}
Object.keys(DB).forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c+" ("+CITY[c]+")";$("ctry").appendChild(o)});
$("ctry").value=st.country;
$("ctry").onchange=function(){setCountry(this.value)};
for(var hh=6;hh<=14;hh++){var oo=document.createElement("option");oo.value=hh;oo.textContent=(hh<10?"0":"")+hh+":00";$("t0").appendChild(oo)}
$("t0").value=st.t0;$("t0").onchange=function(){st.t0=+this.value;render()};
$("tw").onclick=function(){st.view="world";render()};
$("tn").onclick=function(){st.view="nav";render()};
$("ndemo").onclick=function(){navStart([P[nav.f],P[nav.t]])};
$("nf").onchange=function(){navStop();nav.f=+this.value;navPrep([P[nav.f],P[nav.t]]);render()};
$("nt").onchange=function(){navStop();nav.t=+this.value;navPrep([P[nav.f],P[nav.t]]);render()};
$("nm1").onclick=function(){nav.mode="walk";$("nm1").classList.add("on");$("nm2").classList.remove("on");navHud()};
$("nm2").onclick=function(){nav.mode="drive";$("nm2").classList.add("on");$("nm1").classList.remove("on");navHud()};
$("ngo").onclick=function(){if(nav.run||gps.id!==null){navStop();navPrep([P[nav.f],P[nav.t]]);render()}else gpsStart()};
$("nall").onclick=function(){var l=[P[st.start]];st.plan.forEach(function(x){if(l[l.length-1].id!==x.p.id)l.push(x.p)});if(l.length<2){$("ntx").textContent="Your plan has no stops to navigate";return}nav.f=l[0].id;nav.t=l[l.length-1].id;$("nf").value=nav.f;$("nt").value=nav.t;navStart(l)};$("tc").onclick=function(){st.view="city";render()};
fillStart();
$("start").onchange=function(){st.start=+this.value;render()};
$("hrs").oninput=function(){st.hrs=+this.value;render()};
TAGS.forEach(function(g){var b=document.createElement("button");b.className="chip"+(st.tags[g]?" on":"");b.textContent=g==="quiet"?"Avoid crowds":g[0].toUpperCase()+g.slice(1);
  b.onclick=function(){st.tags[g]=st.tags[g]?0:1;b.classList.toggle("on");render()};$("chips").appendChild(b)});
render();
</script>
